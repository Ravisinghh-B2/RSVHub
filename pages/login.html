<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login & Signup</title>
    <style>
        body {
            background: #18171a;
            color: #f3f3f3;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        .auth-container {
            background: #222127;
            border-radius: 18px;
            box-shadow: 0 8px 32px #100820c0;
            max-width: 360px;
            width: 90vw;
            padding: 2.7em 2em 1.7em;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin: 2em 0;
        }

        h2 {
            margin-bottom: 1em;
            font-weight: 700;
            letter-spacing: .04em;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .form-section {
            transition: opacity .36s, transform .36s;
        }

        .form-section:not(.active) {
            opacity: 0;
            pointer-events: none;
            height: 0;
            overflow: hidden;
            position: absolute;
            width: 100%;
            top: 2em;
            left: 0;
        }

        .form-section.active {
            opacity: 1;
            height: auto;
            pointer-events: all;
            position: relative;
        }

        form input {
            width: 94%;
            margin-bottom: 1.25em;
            border-radius: 8px;
            border: none;
            font-size: 1em;
            background: #1a1923;
            color: #e8e8fb;
            padding: 1em;
            transition: background .2s;
        }

        form input:focus {
            outline: 2px solid #8376fd;
            background: #252240;
        }

        .btn-3d {
            background: linear-gradient(146deg, #292857 68%, #16151a);
            color: #fff;
            border: none;
            padding: 1em;
            font-size: 1em;
            border-radius: 12px;
            box-shadow: 0 6px 24px 0 #100821ba;
            cursor: pointer;
            margin: 0.4em 0 1em 0;
            font-weight: 700;
            transition: transform .13s, box-shadow .15s, background .16s;
            width: 100%;
        }

        .btn-3d:hover {
            background: #373551;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 25px 5px #201b3d94;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: #aaa;
            text-decoration: underline;
            cursor: pointer;
            font-size: 1em;
            transition: color .23s;
            padding: .12em 0;
            margin-bottom: 1.5em;
        }

        .toggle-btn:hover {
            color: #f3f3f3;
        }

        .msg {
            color: #d44;
            text-align: center;
            margin-bottom: 1em;
            min-height: 1em;
            font-size: .98em;
        }

        @media (max-width: 500px) {
            .auth-container {
                padding: 2em .4em;
            }
        }
    </style>
</head>

<body>
    <a href="../index.html"
        style="position: absolute; top: 20px; left: 20px; color: #aaa; text-decoration: none; font-size: 0.9em;">&larr;
        Back to Home</a>
    <div class="auth-container">
        <div id="login-section" class="form-section active">
            <h2>Login</h2>
            <div id="login-msg" class="msg"></div>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit" class="btn-3d">Login</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm('signup')">
                Don't have an account? Sign Up
            </button>
        </div>
        <div id="signup-section" class="form-section">
            <h2>Sign Up</h2>
            <div id="signup-msg" class="msg"></div>
            <form id="signup-form">
                <input type="text" id="signup-username" placeholder="Username" required />
                <input type="email" id="signup-email" placeholder="Email" required />
                <input type="password" id="signup-password" placeholder="Password" required />
                <button type="submit" class="btn-3d">Sign Up</button>
            </form>
            <button class="toggle-btn" onclick="toggleForm('login')">
                Already have an account? Login
            </button>
        </div>
    </div>
    <script>
        function toggleForm(show) {
            document.getElementById("login-section").classList.toggle("active", show === "login");
            document.getElementById("signup-section").classList.toggle("active", show === "signup");
            document.getElementById("login-msg").textContent = '';
            document.getElementById("signup-msg").textContent = '';
        }
        document.getElementById("login-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const user = document.getElementById("login-username").value.trim();
            const pass = document.getElementById("login-password").value;
            if (!user || !pass) {
                document.getElementById("login-msg").textContent = "Enter username and password";
                return;
            }
            document.getElementById("login-msg").textContent = "Demo only: login not connected.";
        });
        document.getElementById("signup-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const user = document.getElementById("signup-username").value.trim();
            const email = document.getElementById("signup-email").value.trim();
            const pass = document.getElementById("signup-password").value;
            if (!user || !email || !pass) {
                document.getElementById("signup-msg").textContent = "All fields required";
                return;
            }
            document.getElementById("signup-msg").textContent = "Demo only: signup not connected.";
        });
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Watch — RSV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/theme.js"></script>
</head>

<body>

    <!-- ══ NAVBAR ══════════════════════════════════════════════ -->
    <header class="navbar" id="navbar">
        <div class="nav-left">
            <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <a href="../index.html" class="logo">
                <svg viewBox="0 0 90 20" class="logo-svg" aria-label="RSV Logo">
                    <text x="0" y="16" class="logo-text">RSV</text>
                </svg>
            </a>
        </div>
        <div class="nav-center">
            <form class="search-form" id="searchForm" role="search">
                <input type="text" id="searchInput" class="search-input" placeholder="Search videos..."
                    autocomplete="off" />
                <button type="submit" class="search-btn">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                    </svg>
                </button>
            </form>
        </div>
        <div class="nav-right">
            <button class="search-toggle-btn" id="searchToggleBtn" aria-label="Search">
                <svg viewBox="0 0 24 24">
                    <path
                        d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
                </svg>
            </button>

            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                <svg viewBox="0 0 24 24"></svg>
            </button>

            <div id="authSection"></div>
        </div>
    </header>

    <!-- ══ WATCH LAYOUT ══════════════════════════════════════════ -->
    <div class="watch-layout">

        <!-- Left: Video Player + Info -->
        <div class="watch-main">

            <!-- Spinner while loading -->
            <div class="spinner" id="spinner">
                <div class="spinner-ring"></div>
            </div>

            <!-- Video Player -->
            <div class="video-player-container hidden" id="playerContainer">
                <iframe id="videoPlayer" class="video-player" allowfullscreen
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    loading="lazy" title="Video Player">
                </iframe>
            </div>

            <!-- Video Info -->
            <div class="video-info-panel hidden" id="videoInfo">
                <h1 class="watch-title" id="watchTitle"></h1>
                <div class="watch-meta">
                    <span class="watch-category" id="watchCategory"></span>
                    <span class="watch-views">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" />
                        </svg>
                        <span id="watchViews"></span>
                    </span>
                    <span class="watch-date" id="watchDate"></span>
                </div>
                <div class="watch-description" id="watchDescription"></div>
            </div>

            <!-- Error state -->
            <div class="error-state hidden" id="errorState">
                <p>⚠️ Could not load video.</p>
                <a href="../index.html" class="btn-primary">← Go Back</a>
            </div>
        </div>

        <!-- Right: Related Videos -->
        <aside class="watch-sidebar">
            <h3 class="related-heading">Related Videos</h3>
            <div id="relatedList" class="related-list">
                <!-- Populated by watch.js -->
            </div>
        </aside>

    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/watch.js"></script>
</body>

</html>
